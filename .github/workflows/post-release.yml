#  For more information about TARDIS pipelines, please refer to:
#
#    https://tardis-sn.github.io/tardis/contributing/development/continuous_integration.html

name: post-release

on:
  release:
    types: [published]
  workflow_dispatch: # manual trigger

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: tardis-sn/stardis
          fetch-depth: 0

      - name: Get release tag
        id: get-tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=$(gh release view --json tagName -q '.tagName')" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: pyproject.toml
          args: --verbose --tag ${{ steps.get-tag.outputs.tag }}
        env:
          OUTPUT: CHANGELOG.md

      - uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: CHANGELOG.md

  citation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Wait for Zenodo webhook
        run: sleep 180

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install doi2cff
        run: pip install git+https://github.com/citation-file-format/doi2cff "nameparser<3"

      - name: Update CITATION.cff
        run: |
          rm -f CITATION.cff
          max_attempts=10
          attempt=1
          until doi2cff init 10.5281/zenodo.15677112 || [ $attempt -eq $max_attempts ]; do
            echo "Attempt $attempt failed. Retrying in 60 seconds..."
            rm -f CITATION.cff
            sleep 60
            attempt=$((attempt + 1))
          done

      - uses: actions/upload-artifact@v7
        with:
          name: citation
          path: CITATION.cff

  pull_request:
    needs: [changelog, citation]
    runs-on: ubuntu-latest
    steps:
      # TEST STUB: real job opens a PR via tardis-bot/stardis
      - uses: actions/download-artifact@v8
        with:
          path: /tmp

      - run: head -20 /tmp/changelog/CHANGELOG.md && cat /tmp/citation/CITATION.cff
