#  For more information about TARDIS pipelines, please refer to:
#
#    https://tardis-sn.github.io/tardis/contributing/development/continuous_integration.html

name: pre-release

on:
  schedule:
    - cron: "*/10 * * * *" # TEST: every 10 minutes
  workflow_dispatch: # manual trigger

permissions: # TEST: GA-test default token is read only
  contents: write

defaults:
  run:
    shell: bash -l {0}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # A tag on HEAD means nothing was committed since the last release
      - name: Check for commits since the last release
        id: check
        run: |
          if git describe --tags --exact-match --match 'release-*' HEAD; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

  zenodo:
    needs: check
    if: github.event_name == 'workflow_dispatch' || needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "TEST STUB zenodo notebook"

  pip_tests:
    needs: check
    if: github.event_name == 'workflow_dispatch' || needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "TEST STUB pip tests"

  pull_request:
    needs: [zenodo, pip_tests]
    runs-on: ubuntu-latest
    outputs:
      pr-operation: ${{ steps.create-pr.outputs.pull-request-operation }}
    steps:
      # TEST STUB: real job opens a PR via tardis-bot/stardis; "none" means no PR, so release runs directly
      - id: create-pr
        run: echo "pull-request-operation=none" >> $GITHUB_OUTPUT

  release:
    needs: [pull_request]
    if: needs.pull_request.outputs.pr-operation != 'created'
    uses: ./.github/workflows/release.yml
    with:
      called-from-pre-release: true
    secrets: inherit
